name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /conference-hall-led-maker/
      - name: Make framework assets Pages-safe
        run: |
          # GitHub Pages does not publish directories beginning with an underscore.
          # Vinext nests its framework files below the configured project base path,
          # while Pages maps that URL prefix to the artifact root.
          mv dist/client/conference-hall-led-maker/_next dist/client/next-assets
          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.rsc' -o -name '*.json' \) -exec sed -i 's!/_next/!/next-assets/!g' {} +
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
